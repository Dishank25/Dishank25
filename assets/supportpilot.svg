@keyframes scan {0%{transform:rotate(-28deg);opacity:0}12%{opacity:.65}78%{opacity:.5}100%{transform:rotate(40deg);opacity:0}}
@keyframes glimmer {0%,100%{opacity:.04}50%{opacity:.21}}
.filament{animation:flow 4.4s linear infinite}.glint{animation:blink 4.9s ease-in-out infinite}
.drift{animation:drift 8s ease-in-out infinite}.beam{animation:glimmer 7s ease-in-out infinite}
.scan{animation:scan 6.5s ease-in-out infinite;transform-origin:0 0}
@media (prefers-reduced-motion:reduce){.filament,.glint,.drift,.beam,.scan{animation:none!important}}
