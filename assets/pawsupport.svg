<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 206" width="820" height="206" role="img" aria-labelledby="title desc">
<title id="title">PawSupport</title><desc id="desc">An animated stack of FAQ cards lifts the selected source, illustrated with a paw print.</desc>
<defs>
<linearGradient id="bg" x2="1" y2=".45" gradientUnits="objectBoundingBox"><stop stop-color="#1b141a"/><stop offset=".50" stop-color="#25141e"/><stop offset="1" stop-color="#361922"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#89304a" stop-opacity=".52"/><stop offset="1" stop-color="#89304a" stop-opacity="0"/></radialGradient>
<linearGradient id="edge" x2="1" y2=".6" gradientUnits="objectBoundingBox"><stop stop-color="#78505b"/><stop offset=".5" stop-color="#52313e"/><stop offset="1" stop-color="#fc969b"/></linearGradient>
<pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle r=".85" cx="1" cy="1" fill="#fc969b" opacity=".20"/></pattern>
<clipPath id="clip"><rect x="1" y="1" width="818" height="204" rx="13"/></clipPath>

<linearGradient id="paper" x1="0" y1="1" x2=".9" y2="0" gradientUnits="objectBoundingBox"><stop stop-color="#401b32"/><stop offset=".46" stop-color="#84354a"/><stop offset=".86" stop-color="#af5060"/><stop offset="1" stop-color="#cd6972"/></linearGradient>
<linearGradient id="lip"><stop stop-color="#4c1f31"/><stop offset=".42" stop-color="#a23c53"/><stop offset="1" stop-color="#da677a"/></linearGradient>
<linearGradient id="topLight"><stop stop-color="#e77f8f"/><stop offset=".6" stop-color="#ffddcb"/><stop offset="1" stop-color="#ff9e99"/></linearGradient>
<filter id="soft" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>
<style>
  .project {font-family: Georgia, 'Liberation Serif', serif; font-weight: 600; fill: #fff3df;}
  .descriptor {font-family: 'DejaVu Sans', Arial, sans-serif; fill: #ead5cd;}
  .terminal {font-family: 'DejaVu Sans Mono', monospace; font-weight: 600;}
  .travel {stroke-dasharray: 2 39; animation: travel 3.5s linear infinite;}
  .light {animation: glow 3.2s ease-in-out infinite;}
  .sheet {animation: select 4.4s ease-in-out infinite;}
  @keyframes travel {to {stroke-dashoffset: -82;}}
  @keyframes glow {0%,100% {opacity:.55;} 50% {opacity:1;}}
  @keyframes select {0%,15%,100% {transform:translateY(0);} 48%,62% {transform:translateY(-4px);}}
  @media (prefers-reduced-motion: reduce) {.travel,.light,.sheet {animation:none!important;}}
</style>
</defs>
<g clip-path="url(#clip)">
 <rect width="820" height="206" fill="url(#bg)"/>
 <ellipse cx="660" cy="100" rx="267" ry="151" fill="url(#halo)"/>
 <path d="M430 0H820V206H396Z" fill="url(#dots)"/>
 <g fill="none" stroke-linecap="round"><path stroke="#784253" stroke-width="1.3" d="M440 146h39l22-13h59"/><path class="travel" stroke="#ff9d9a" stroke-width="2.3" d="M440 146h39l22-13h59"/><circle cx="439" cy="146" r="3" fill="#f99e97" stroke="none"/></g>
<path d="M494 147l163-49 103 49-161 49z" fill="#100d12" opacity=".78" filter="url(#soft)"/>
<g transform="translate(0 45)" stroke-linejoin="round">
     <path d="M505 84l161-49 91 45-161 50z" fill="#2d192a" stroke="#674453" stroke-width="1.15"/>
     <path d="M505 84l91 46 161-50v5l-161 50-91-46z" fill="#311929" stroke="#674453" stroke-width=".9"/>
     <path d="M604 130l40-12m7-2 11-3" stroke="#674453" stroke-width="1.5"/></g>
<g transform="translate(0 31)" stroke-linejoin="round">
     <path d="M505 84l161-49 91 45-161 50z" fill="#382134" stroke="#8f5261" stroke-width="1.15"/>
     <path d="M505 84l91 46 161-50v5l-161 50-91-46z" fill="#311929" stroke="#8f5261" stroke-width=".9"/>
     <path d="M604 130l40-12m7-2 11-3" stroke="#8f5261" stroke-width="1.5"/></g>
<g transform="translate(0 17)" stroke-linejoin="round">
     <path d="M505 84l161-49 91 45-161 50z" fill="#54263b" stroke="#bc6a78" stroke-width="1.15"/>
     <path d="M505 84l91 46 161-50v5l-161 50-91-46z" fill="#311929" stroke="#bc6a78" stroke-width=".9"/>
     <path d="M604 130l40-12m7-2 11-3" stroke="#bc6a78" stroke-width="1.5"/></g>
<g class="sheet" stroke-linejoin="round"><path d="M505 84l91 46 161-50v5l-161 50-91-46z" fill="url(#lip)" stroke="#dd8594" stroke-width=".75"/>
<path d="M505 84l161-49 91 45-161 50z" fill="url(#paper)" stroke="url(#topLight)" stroke-width="1.9"/>
<path d="M526 85l139-41 72 35-140 44z" stroke="#f3ada8" stroke-width=".9" stroke-opacity=".7" fill="none"/>
<g transform="matrix(1 -.30 .62 .31 505 84)">
 <path d="M53 97c0-11 7-15 11-26 3-8 10-13 18-13 9 0 14 5 18 13 5 9 13 15 13 24 0 7-7 12-15 10l-13-4c-3-1-5-1-9 0l-13 4c-5 1-10-2-10-8z" fill="#ffe5d4"/>
 <g fill="#ffe5d4"><ellipse cx="54" cy="59" rx="7.8" ry="12" transform="rotate(-27 54 59)"/><ellipse cx="70" cy="43" rx="8.2" ry="13" transform="rotate(-12 70 43)"/><ellipse cx="91" cy="41" rx="8.3" ry="13" transform="rotate(11 91 41)"/><ellipse cx="109" cy="52" rx="7.4" ry="12" transform="rotate(27 109 52)"/></g>
</g><path d="M602 131l59-18" stroke="#ffbbab" stroke-width="2"/></g>
 <g transform="translate(38 0)">
  <path fill="none" stroke="#fc969b" stroke-width="3.4" stroke-linecap="square" stroke-linejoin="round" d="M1 40l9 7-9 7 M15 55h14"/>
  <text class="project" x="0" y="116" font-size="61" letter-spacing="-2.5">PawSupport</text>
  <text class="descriptor" x="2" y="150" font-size="20" letter-spacing=".1">FAQ routing and evaluation</text>
 </g>
</g>
<rect x="1" y="1" rx="13" width="818" height="204" stroke="url(#edge)" stroke-width="1.4" fill="none"/>
</svg>
