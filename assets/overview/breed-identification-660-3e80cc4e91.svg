<svg xmlns="http://www.w3.org/2000/svg" width="660" height="319" viewBox="0 0 660 319" role="img" aria-labelledby="title desc"><title id="title">Pet breed identification</title><desc id="desc">Computer vision. Pet breed identification. This computer vision prototype takes a photo, requests a structured prediction from GPT-4o Vision, and validates the response. It returns an explicit “unknown” when the model reports low confidence. Open the case study.</desc><rect width="100%" height="100%" fill="#0b1922"/><path d="M22 0v319" stroke="#31515a"/><path d="M44 0.5 L616 0.5" stroke="#29454c" fill="none"/><svg x="484" y="43" width="132" height="77" viewBox="0 0 200 105" preserveAspectRatio="xMidYMid meet" overflow="hidden" aria-hidden="true" stroke-linecap="round" stroke-linejoin="round"><path d="M52 35 V20 H69 M132 20 H149 V35 M149 69 V84 H132 M69 84 H52 V69" fill="none" stroke="#699c9e" stroke-width="1.3" /><path d="M70 50 Q69 43 69 28 Q82 31 88 38 Q99 34 110 37 Q119 31 127 26 Q130 39 125 48 Q130 58 123 65 Q114 78 100 80 Q86 79 79 70 Q68 65 70 50Z" fill="#112830" stroke="#699c9e" stroke-width="1.25" /><path d="M73 34 76 45 82 40Z M122 33 114 40 123 43Z" fill="#15363d" stroke="#426870" stroke-width="1" /><path d="M79 52 Q83 48 89 51 M107 50 Q115 46 119 49 M94 61 Q100 57 105 60 L100 65Z M100 65 Q97 69 93 68 M100 65 Q103 68 108 66" fill="none" stroke="#a1ecd7" stroke-width="1.3" /><path d="M85 60 65 57 M86 64 65 68 M112 58 133 53 M113 63 134 64" fill="none" stroke="#699c9e" stroke-width="0.95" /><path d="M26 44 H50 M30 58 H61 M151 52 H162 Q166 52 169 48 L177 40 H186" fill="none" stroke="#32515b" stroke-width="0.95" /><circle cx="83" cy="52" r="1.4" fill="#a1ecd7" stroke="none" stroke-width="1"/><circle cx="115" cy="50" r="1.4" fill="#a1ecd7" stroke="none" stroke-width="1"/><circle cx="182" cy="40" r="5.1" fill="none" stroke="#699c9e" stroke-width="1"/><circle cx="182" cy="40" r="2.4" fill="#a1ecd7" stroke="none" stroke-width="1"/></svg><text x="44" y="34" fill="#a1cbbe" font-family="'Liberation Mono',Consolas,monospace" font-size="14" font-weight="400" font-style="normal" letter-spacing="0.9">COMPUTER VISION</text><text x="44" y="83" fill="#e7f5f3" font-family="Arial,Helvetica,sans-serif" font-size="33" font-weight="700" font-style="normal" letter-spacing="-1.155">Pet breed identification</text><text x="44" y="126" fill="#c1d8d9" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" font-style="normal" letter-spacing="0">This computer vision prototype takes a</text><text x="44" y="156" fill="#c1d8d9" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" font-style="normal" letter-spacing="0">photo, requests a structured prediction</text><text x="44" y="186" fill="#c1d8d9" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" font-style="normal" letter-spacing="0">from GPT-4o Vision, and validates the</text><text x="44" y="216" fill="#c1d8d9" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" font-style="normal" letter-spacing="0">response. It returns an explicit “unknown”</text><text x="44" y="246" fill="#c1d8d9" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" font-style="normal" letter-spacing="0">when the model reports low confidence.</text><text x="44" y="283" fill="#80ead2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" font-style="normal" letter-spacing="0">View project</text><path d="M156 281l8 -8m-8 0h8v8" fill="none" stroke="#80ead2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
