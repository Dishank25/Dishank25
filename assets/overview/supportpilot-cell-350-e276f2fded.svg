<svg xmlns="http://www.w3.org/2000/svg" width="350" height="300" viewBox="0 0 350 300" role="img" aria-labelledby="title desc"><title id="title">SupportPilot</title><desc id="desc">Semantic retrieval. SupportPilot. A FastAPI service retrieves three FAQs from ChromaDB. The closest match determines whether the service passes context to the language model or returns a fallback. You can change the match distance in the demo and see the decision flip. Open the case study.</desc><rect width="100%" height="100%" fill="#0b1922"/><path d="M23 0.5 L328 0.5" stroke="#29454c" fill="none"/><text x="23" y="27" fill="#a1cbbe" font-family="'Liberation Mono',Consolas,monospace" font-size="10" font-weight="400" font-style="normal" letter-spacing="0.55">SEMANTIC RETRIEVAL</text><svg x="281" y="5" width="47" height="29" viewBox="0 0 200 105" preserveAspectRatio="xMidYMid meet" overflow="hidden" aria-hidden="true" stroke-linecap="round" stroke-linejoin="round"><path d="M66.5 38.3 A17 17 0 0 1 66.5 67.7" fill="none" stroke="#426870" stroke-width="0.85" /><path d="M70.0 32.2 A24 24 0 0 1 70.0 73.8" fill="none" stroke="#426870" stroke-width="0.85" /><path d="M73.5 26.2 A31 31 0 0 1 73.5 79.8" fill="none" stroke="#426870" stroke-width="0.85" /><path d="M77.5 19.2 A39 39 0 0 1 77.5 86.8" fill="none" stroke="#426870" stroke-width="0.85" /><path d="M17 25 C45 25 50 41 67 46" fill="none" stroke="#426870" stroke-width="1.15" /><path d="M12 53 H107" fill="none" stroke="#a1ecd7" stroke-width="1.35" /><path d="M24 78 C46 78 54 65 71 60" fill="none" stroke="#426870" stroke-width="1.15" /><path d="M107 53 120 40 133 53 120 66Z" fill="#15363d" stroke="#a1ecd7" stroke-width="1.35" /><path d="M133 53 C147 53 147 32 162 32 H180" fill="none" stroke="#a1ecd7" stroke-width="1.35" /><path d="M133 53 C148 53 147 75 163 75 H180" fill="none" stroke="#699c9e" stroke-width="1" stroke-dasharray="3 4"/><circle cx="180" cy="75" r="3.4" fill="#0b1922" stroke="#699c9e" stroke-width="1"/><circle cx="180" cy="32" r="5.1" fill="none" stroke="#699c9e" stroke-width="1"/><circle cx="180" cy="32" r="2.4" fill="#a1ecd7" stroke="none" stroke-width="1"/><circle cx="120" cy="53" r="2" fill="#a1ecd7" stroke="none" stroke-width="1"/><circle cx="17" cy="25" r="2.5" fill="#699c9e" stroke="none" stroke-width="1"/><circle cx="12" cy="53" r="5.1" fill="none" stroke="#699c9e" stroke-width="1"/><circle cx="12" cy="53" r="2.4" fill="#a1ecd7" stroke="none" stroke-width="1"/><circle cx="24" cy="78" r="2.5" fill="#699c9e" stroke="none" stroke-width="1"/><path d="M107 19 H133 M120 14 V24 M107 83 H133" fill="none" stroke="#32515b" stroke-width="0.8" /></svg><text x="23" y="61" fill="#e7f5f3" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" font-style="normal" letter-spacing="-0.735">SupportPilot</text><text x="23" y="88" fill="#c1d8d9" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" font-style="normal" letter-spacing="0">A FastAPI service retrieves three FAQs</text><text x="23" y="111" fill="#c1d8d9" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" font-style="normal" letter-spacing="0">from ChromaDB. The closest match</text><text x="23" y="134" fill="#c1d8d9" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" font-style="normal" letter-spacing="0">determines whether the service passes</text><text x="23" y="157" fill="#c1d8d9" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" font-style="normal" letter-spacing="0">context to the language model or returns</text><text x="23" y="180" fill="#c1d8d9" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" font-style="normal" letter-spacing="0">a fallback. You can change the match</text><text x="23" y="203" fill="#c1d8d9" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" font-style="normal" letter-spacing="0">distance in the demo and see the</text><text x="23" y="226" fill="#c1d8d9" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" font-style="normal" letter-spacing="0">decision flip.</text><text x="23" y="278" fill="#80ead2" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" font-style="normal" letter-spacing="0">View project</text></svg>
