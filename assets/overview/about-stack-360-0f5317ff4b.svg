<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1659" viewBox="0 0 360 553" role="img" aria-labelledby="title desc"><title id="title">About me</title><desc id="desc">Noida, India. About me. I&#x27;m Dishank Jain, an AI engineer based in Noida, India. I build Python tools for semantic search, document extraction, and recommendations. I like being able to trace a result back to the input that produced it. With an FAQ assistant, that means checking which policy it retrieved. With a recommender, it means understanding why one product ranked above another. My projects bring machine learning models, Python APIs, and Flutter interfaces together.</desc><rect width="100%" height="100%" fill="#0b1922"/><path d="M15 0v553" stroke="#31515a"/><circle cx="15" cy="39" r="4.25" fill="#0b1922" stroke="#80ead2"/><circle cx="15" cy="39" r="1.3" fill="#80ead2"/><text x="31" y="43" fill="#80ead2" font-family="'Liberation Mono',Consolas,monospace" font-size="12" font-weight="400" font-style="normal" letter-spacing="0.9">NOIDA, INDIA</text><text x="31" y="97" fill="#e7f5f3" font-family="Arial,Helvetica,sans-serif" font-size="43" font-weight="700" font-style="normal" letter-spacing="-1.935">About</text><text x="154.081" y="97" fill="#80ead2" font-family="Georgia,'Liberation Serif',serif" font-size="43" font-weight="400" font-style="italic" letter-spacing="-1.935">me.</text><text x="31" y="139" fill="#c1d8d9" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" font-style="normal" letter-spacing="0">I&#x27;m Dishank Jain, an AI engineer</text><text x="31" y="165" fill="#c1d8d9" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" font-style="normal" letter-spacing="0">based in Noida, India. I build Python</text><text x="31" y="191" fill="#c1d8d9" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" font-style="normal" letter-spacing="0">tools for semantic search,</text><text x="31" y="217" fill="#c1d8d9" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" font-style="normal" letter-spacing="0">document extraction, and</text><text x="31" y="243" fill="#c1d8d9" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" font-style="normal" letter-spacing="0">recommendations. I like being able</text><text x="31" y="269" fill="#c1d8d9" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" font-style="normal" letter-spacing="0">to trace a result back to the input</text><text x="31" y="295" fill="#c1d8d9" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" font-style="normal" letter-spacing="0">that produced it. With an FAQ</text><text x="31" y="321" fill="#c1d8d9" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" font-style="normal" letter-spacing="0">assistant, that means checking</text><text x="31" y="347" fill="#c1d8d9" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" font-style="normal" letter-spacing="0">which policy it retrieved. With a</text><text x="31" y="373" fill="#c1d8d9" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" font-style="normal" letter-spacing="0">recommender, it means</text><text x="31" y="399" fill="#c1d8d9" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" font-style="normal" letter-spacing="0">understanding why one product</text><text x="31" y="425" fill="#c1d8d9" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" font-style="normal" letter-spacing="0">ranked above another.</text><text x="31" y="461" fill="#c1d8d9" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" font-style="normal" letter-spacing="0">My projects bring machine learning</text><text x="31" y="487" fill="#c1d8d9" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" font-style="normal" letter-spacing="0">models, Python APIs, and Flutter</text><text x="31" y="513" fill="#c1d8d9" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" font-style="normal" letter-spacing="0">interfaces together.</text></svg>
