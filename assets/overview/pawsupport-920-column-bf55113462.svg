<svg xmlns="http://www.w3.org/2000/svg" width="432" height="338" viewBox="0 0 432 338" role="img" aria-labelledby="title desc"><title id="title">PawSupport</title><desc id="desc">FAQ routing. PawSupport. Customers can ask about the same policy in very different ways. This pet-care assistant tries an exact FAQ match, semantic search, and alias lookup. I evaluate it against expected FAQ identifiers so a fluent answer drawn from the wrong policy still counts as a miss. Open the case study.</desc><rect width="100%" height="100%" fill="#0b1922"/><path d="M31 0v338" stroke="#31515a"/><path d="M60 0.5L402 0.5" stroke="#29454c" fill="none"/><svg x="332" y="4" width="70" height="29" viewBox="0 0 200 105" preserveAspectRatio="xMidYMid meet" overflow="hidden" aria-hidden="true" stroke-linecap="round" stroke-linejoin="round"><path d="M70 61 113 34 165 48 123 77Z" fill="#112830" stroke="#426870" stroke-width="1" /><path d="M70 58 113 31 165 45 123 74Z" fill="#0b1922" stroke="#426870" stroke-width="1" /><path d="M66 51 110 23 166 37 121 68Z" fill="#15363d" stroke="#699c9e" stroke-width="1.1" /><path d="M63 44 108 16 163 29 118 60Z" fill="#112830" stroke="#699c9e" stroke-width="1.25" /><path d="M63 44 118 60 163 29 M118 60V64" fill="none" stroke="#a1ecd7" stroke-width="1.15" /><path d="M77 43 103 27 M86 45 115 27 M95 47 112 37" fill="none" stroke="#699c9e" stroke-width="1.05" /><path d="M124 33 130 37 145 28" fill="none" stroke="#a1ecd7" stroke-width="1.7" /><path d="M13 72 C29 72 31 65 42 58 S58 50 69 51" fill="none" stroke="#426870" stroke-width="1.2" /><path d="M13 55 C31 53 41 46 63 44" fill="none" stroke="#a1ecd7" stroke-width="1.3" /><path d="M23 82 C42 83 45 71 56 66 S65 63 71 62" fill="none" stroke="#426870" stroke-width="1.2" /><path d="M91 80 122 89 164 60" fill="none" stroke="#32515b" stroke-width="0.9" stroke-dasharray="2 4"/><circle cx="13" cy="72" r="1.8" fill="#699c9e" stroke="none" stroke-width="1"/><circle cx="13" cy="55" r="5.1" fill="none" stroke="#699c9e" stroke-width="1"/><circle cx="13" cy="55" r="2.4" fill="#a1ecd7" stroke="none" stroke-width="1"/><circle cx="23" cy="82" r="1.8" fill="#699c9e" stroke="none" stroke-width="1"/></svg><text x="60" y="25" fill="#a1cbbe" font-family="'Liberation Mono',Consolas,monospace" font-size="12" font-weight="400" font-style="normal" letter-spacing="0.7">FAQ ROUTING</text><text x="60" y="66" fill="#e7f5f3" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" font-style="normal" letter-spacing="-0.65">PawSupport</text><text x="60" y="94" fill="#c1d8d9" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" font-style="normal" letter-spacing="0">Customers can ask about the same</text><text x="60" y="121" fill="#c1d8d9" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" font-style="normal" letter-spacing="0">policy in very different ways. This</text><text x="60" y="148" fill="#c1d8d9" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" font-style="normal" letter-spacing="0">pet-care assistant tries an exact FAQ</text><text x="60" y="175" fill="#c1d8d9" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" font-style="normal" letter-spacing="0">match, semantic search, and alias</text><text x="60" y="202" fill="#c1d8d9" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" font-style="normal" letter-spacing="0">lookup. I evaluate it against expected</text><text x="60" y="229" fill="#c1d8d9" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" font-style="normal" letter-spacing="0">FAQ identifiers so a fluent answer drawn</text><text x="60" y="256" fill="#c1d8d9" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" font-style="normal" letter-spacing="0">from the wrong policy still counts as a</text><text x="60" y="283" fill="#c1d8d9" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" font-style="normal" letter-spacing="0">miss.</text><text x="60" y="314" fill="#80ead2" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" font-style="normal" letter-spacing="0">View project</text></svg>
