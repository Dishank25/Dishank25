<svg xmlns="http://www.w3.org/2000/svg" width="960" height="298" viewBox="0 0 960 298" role="img" aria-labelledby="title desc"><title id="title">Terminal tic-tac-toe</title><desc id="desc">Python / Standard library. Terminal tic-tac-toe. One of my early Python projects. The player picks a numbered square and the computer chooses a free square at random. The board, turns, and win checks fit in a single standard-library script. Open the case study.</desc><rect width="100%" height="100%" fill="#0b1922"/><path d="M32 0v298" stroke="#31515a"/><path d="M64 0.5 L896 0.5" stroke="#29454c" fill="none"/><svg x="701" y="43" width="195" height="113" viewBox="0 0 200 105" preserveAspectRatio="xMidYMid meet" overflow="hidden" aria-hidden="true" stroke-linecap="round" stroke-linejoin="round"><path d="M46 16 H143 L151 23 V85 H46Z" fill="#112830" stroke="#699c9e" stroke-width="1.1" /><path d="M46 26 H151 M52 91 H145" fill="none" stroke="#32515b" stroke-width="1" /><circle cx="52" cy="21" r="1" fill="#a1ecd7" stroke="none" stroke-width="1"/><circle cx="57" cy="21" r="1" fill="#426870" stroke="none" stroke-width="1"/><circle cx="62" cy="21" r="1" fill="#426870" stroke="none" stroke-width="1"/><path d="M87 29 V79 M107 29 V79 M68 44 H126 M68 62 H126" fill="none" stroke="#426870" stroke-width="0.95" /><path d="M19 48 H36 M24 55 H38 M157 69 H178" fill="none" stroke="#32515b" stroke-width="1" /><path d="M74 33 l6 6 M80 33 l-6 6" fill="none" stroke="#a1ecd7" stroke-width="1.5" /><path d="M94 50 l6 6 M100 50 l-6 6" fill="none" stroke="#a1ecd7" stroke-width="1.5" /><path d="M114 68 l6 6 M120 68 l-6 6" fill="none" stroke="#a1ecd7" stroke-width="1.5" /><circle cx="117" cy="36" r="3.7" fill="none" stroke="#699c9e" stroke-width="1.25"/><circle cx="77" cy="54" r="3.7" fill="none" stroke="#699c9e" stroke-width="1.25"/><circle cx="97" cy="71" r="3.7" fill="none" stroke="#699c9e" stroke-width="1.25"/></svg><text x="64" y="34" fill="#a1cbbe" font-family="'Liberation Mono',Consolas,monospace" font-size="14" font-weight="400" font-style="normal" letter-spacing="0.9">PYTHON / STANDARD LIBRARY</text><text x="64" y="83" fill="#e7f5f3" font-family="Arial,Helvetica,sans-serif" font-size="43" font-weight="700" font-style="normal" letter-spacing="-1.505">Terminal tic-tac-toe</text><text x="64" y="126" fill="#c1d8d9" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400" font-style="normal" letter-spacing="0">One of my early Python projects. The player picks a</text><text x="64" y="159" fill="#c1d8d9" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400" font-style="normal" letter-spacing="0">numbered square and the computer chooses a free</text><text x="64" y="192" fill="#c1d8d9" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400" font-style="normal" letter-spacing="0">square at random. The board, turns, and win checks fit in</text><text x="64" y="225" fill="#c1d8d9" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400" font-style="normal" letter-spacing="0">a single standard-library script.</text><text x="64" y="262" fill="#80ead2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" font-style="normal" letter-spacing="0">View project</text><path d="M176 260l8 -8m-8 0h8v8" fill="none" stroke="#80ead2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
