<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1152" viewBox="0 0 360 384" role="img" aria-labelledby="title desc"><title id="title">Student and recruiter job portal</title><desc id="desc">Flutter / Hiring. Student and recruiter job portal. This Flutter project follows both sides of an application. Students browse openings and apply. Recruiters create job or internship postings and review applicants through a separate set of screens. The repository credits the original app snapshot to an109. Open the case study.</desc><rect width="100%" height="100%" fill="#0b1922"/><path d="M15 0v384" stroke="#31515a"/><path d="M31 0.5 L329 0.5" stroke="#29454c" fill="none"/><svg x="261" y="2" width="68" height="39" viewBox="0 0 200 105" preserveAspectRatio="xMidYMid meet" overflow="hidden" aria-hidden="true" stroke-linecap="round" stroke-linejoin="round"><path d="M20 71 67 87 169 54" fill="none" stroke="#32515b" stroke-width="1" stroke-dasharray="2 5"/><path d="M26 31 71 17 76 20 75 69 31 84 26 82Z" fill="#112830" stroke="#426870" stroke-width="1.05" /><path d="M31 34 76 20 75 69 31 84Z" fill="#0b1922" stroke="#699c9e" stroke-width="1.1" /><path d="M37 39 69 29 69 62 37 73Z" fill="#15363d" stroke="#426870" stroke-width="1" /><path d="M42 50 53 47 M42 55 61 49 M42 60 55 56" fill="none" stroke="#699c9e" stroke-width="1" /><path d="M111 30 154 16 160 19 160 67 116 82 111 79Z" fill="#112830" stroke="#426870" stroke-width="1.05" /><path d="M116 33 160 19 160 67 116 82Z" fill="#0b1922" stroke="#699c9e" stroke-width="1.1" /><path d="M122 38 154 28 154 59 122 70Z" fill="#15363d" stroke="#426870" stroke-width="1" /><path d="M129 51 134 54 145 41" fill="none" stroke="#a1ecd7" stroke-width="1.5" /><path d="M60 66 C79 75 87 41 109 47 L118 51 M71 42 C88 29 92 55 107 56" fill="none" stroke="#a1ecd7" stroke-width="1.2" /><circle cx="60" cy="66" r="1.8" fill="#a1ecd7" stroke="none" stroke-width="1"/><circle cx="109" cy="47" r="5.1" fill="none" stroke="#699c9e" stroke-width="1"/><cir