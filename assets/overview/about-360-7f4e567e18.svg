<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1420" viewBox="0 0 360 426" preserveAspectRatio="none" style="background-color:#0b1922" role="img" aria-labelledby="title desc"><title id="title">About me</title><desc id="desc">Noida, India. About me. I&#x27;m Dishank Jain, an AI engineer based in Noida, India. I build Python tools for semantic search, document extraction, and recommendations. I like being able to trace a result back to the input that produced it. With an FAQ assistant, that means checking which policy it retrieved. With a recommender, it means understanding why one product ranked above another. My projects bring machine learning models, Python APIs, and Flutter interfaces together.</desc><rect width="100%" height="100%" fill="#0b1922"/><path d="M15 0v426" stroke="#31515a"/><path d="M31 0.5L329 0.5" stroke="#29454c" fill="none"/><circle cx="15" cy="47" r="4" fill="#0b1922" stroke="#80ead2"/><circle cx="15" cy="47" r="1.2" fill="#80ead2"/><text x="31" y="57" fill="#e7f5f3" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" font-style="normal" letter-spacing="-1.28">About</text><text x="124.046" y="57" fill="#80ead2" font-family="Georgia,'Liberation Serif',serif" font-size="32" font-weight="400" font-style="italic" letter-spacing="-1.28">me</text><text x="31" y="83" fill="#a1cbbe" font-family="'Liberation Mono',Consolas,monospace" font-size="11" font-weight="400" font-style="normal" letter-spacing="0.7">NOIDA, INDIA</text><text x="31" y="112" fill="#c1d8d9" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" font-style="normal" letter-spacing="0">I&#x27;m Dishank Jain, an AI engineer based</text><text x="31" y="136" fill="#c1d8d9" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" font-style="normal" letter-spacing="0">in Noida, India. I build Python tools for</text><text x="31" y="160" fill="#c1d8d9" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" font-style="normal" letter-spacing="0">semantic search, document extraction,</text><text x="31" y="184" fill="#c1d8d9" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" font-style="normal" letter-spacing="0">and recommendations. I like being able</text><text x="31" y="208" fill="#c1d8d9" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" font-style="normal" letter-spacing="0">to trace a result back to the input that</text><text x="31" y="232" fill="#c1d8d9" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" font-style="normal" letter-spacing="0">produced it. With an FAQ assistant, that</text><text x="31" y="256" fill="#c1d8d9" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" font-style="normal" letter-spacing="0">means checking which policy it</text><text x="31" y="280" fill="#c1d8d9" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" font-style="normal" letter-spacing="0">retrieved. With a recommender, it means</text><text x="31" y="304" fill="#c1d8d9" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" font-style="normal" letter-spacing="0">understanding why one product ranked</text><text x="31" y="328" fill="#c1d8d9" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" font-style="normal" letter-spacing="0">above another.</text><text x="31" y="354" fill="#c1d8d9" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" font-style="normal" letter-spacing="0">My projects bring machine learning</text><text x="31" y="378" fill="#c1d8d9" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" font-style="normal" letter-spacing="0">models, Python APIs, and Flutter</text><text x="31" y="402" fill="#c1d8d9" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" font-style="normal" letter-spacing="0">interfaces together.</text></svg>
