<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1603" viewBox="0 0 360 481" preserveAspectRatio="none" style="background-color:#0b1922" role="img" aria-labelledby="title desc"><title id="title">Technical skills</title><desc id="desc">Technical skills. Search and evaluation. Embeddings, ChromaDB, semantic retrieval, labeled FAQ tests. Python applications. FastAPI, Django, Pydantic, REST APIs, Streamlit. Machine learning and data. pandas, NumPy, scikit-learn, collaborative filtering, cosine similarity. Mobile development. Dart, Flutter, Provider, REST integration.</desc><rect width="100%" height="100%" fill="#0b1922"/><path d="M15 0v481" stroke="#31515a"/><path d="M31 0.5L329 0.5" stroke="#29454c" fill="none"/><circle cx="15" cy="47" r="4" fill="#0b1922" stroke="#80ead2"/><circle cx="15" cy="47" r="1.2" fill="#80ead2"/><text x="31" y="57" fill="#e7f5f3" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" font-style="normal" letter-spacing="-1.28">Technical</text><text x="171.754" y="57" fill="#80ead2" font-family="Georgia,'Liberation Serif',serif" font-size="32" font-weight="400" font-style="italic" letter-spacing="-1.28">skills</text><path d="M31 79L329 79" stroke="#29454c" fill="none"/><text x="31" y="112" fill="#e7f5f3" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" font-style="normal" letter-spacing="-0.55">Search and evaluation</text><text x="31" y="139" fill="#c1d8d9" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" font-style="normal" letter-spacing="0">Embeddings, ChromaDB, semantic</text><text x="31" y="163" fill="#c1d8d9" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" font-style="normal" letter-spacing="0">retrieval, labeled FAQ tests</text><path d="M31 185L329 185" stroke="#29454c" fill="none"/><text x="31" y="218" fill="#e7f5f3" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" font-style="normal" letter-spacing="-0.55">