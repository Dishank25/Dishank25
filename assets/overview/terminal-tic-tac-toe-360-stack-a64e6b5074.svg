<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="883" viewBox="0 0 360 265" preserveAspectRatio="none" style="background-color:#0b1922" role="img" aria-labelledby="title desc"><title id="title">Terminal tic-tac-toe</title><desc id="desc">Python / Standard library. Terminal tic-tac-toe. One of my early Python projects. The player picks a numbered square and the computer chooses a free square at random. The board, turns, and win checks fit in a single standard-library script. Open the case study.</desc><rect width="100%" height="100%" fill="#0b1922"/><path d="M15 0v265" stroke="#31515a"/><path d="M31 0.5L329 0.5" stroke="#29454c" fill="none"/><svg x="278" y="4" width="51" height="29" viewBox="0 0 200 105" preserveAspectRatio="xMidYMid meet" overflow="hidden" aria-hidden="true" stroke-linecap="round" stroke-linejoin="round"><path d="M46 16 H143 L151 23 V85 H46Z" fill="#112830" stroke="#699c9e" stroke-width="1.1" /><path d="M46 26 H151 M52 91 H145" fill="none" stroke="#32515b" stroke-width="1" /><circle cx="52" cy="21" r="1" fill="#a1ecd7" stroke="none" stroke-width="1"/><circle cx="57" cy="21" r="1" fill="#426870" stroke="none" stroke-width="1"/><circle cx="62" cy="21" r="1" fill="#426870" stroke="none" stroke-width="1"/><path d="M87 29 V79 M107 29 V79 M68 44 H126 M68 62 H126" fill="none" stroke="#426870" stroke-width="0.95" /><path d="M19 48 H36 M24 55 H38 M157 69 H178" fill="none" stroke="#32515b" stroke-width="1" /><path d="M74 33 l6 6 M80 33 l-6 6" fill="none" stroke="#a1ecd7" stroke-width="1.5" /><path d="M94 50 l6 6 M100 50 l-6 6" fill="none" stroke="#a1ecd7" stroke-width="1.5" /><path d="M114 68 l6 6 M120 68 l-6 6" fill="none" stroke="#a1ecd7" stroke-width="1.5" /><circle cx="117" cy="36" r="3.7" fill="none" stroke="#699c9e" stroke-width="1.25"/><circle cx="77" cy="54" r="3.7" fill="none" stroke="#699c9e" stroke-width="1.25"/><circle cx="97" cy="71" r="3.7" fill="none" stroke="#699c9e" stroke-width="1.25"/></svg><text x="31" y="25" fill="#a1cbbe" font-family="'Liberation Mono',Consolas,monospace" font-size="11" font-weight="400" font-style="normal" letter-spacing="0.7">PYTHON / STANDARD LIBRARY</text><text x="31" y="62" fill="#e7f5f3" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" font-style="normal" letter-spacing="-0.55">Terminal tic-tac-toe</text><text x="31" y="90" fill="#c1d8d9" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" font-style="normal" letter-spacing="0">One of my early Python projects. The</text><text x="31" y="114" fill="#c1d8d9" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" font-style="normal" letter-spacing="0">player picks a numbered square and the</text><text x="31" y="138" fill="#c1d8d9" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" font-style="normal" letter-spacing="0">computer chooses a free square at</text><text x="31" y="162" fill="#c1d8d9" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" font-style="normal" letter-spacing="0">random. The board, turns, and win</text><text x="31" y="186" fill="#c1d8d9" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" font-style="normal" letter-spacing="0">checks fit in a single standard-library</text><text x="31" y="210" fill="#c1d8d9" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" font-style="normal" letter-spacing="0">script.</text><text x="31" y="241" fill="#80ead2" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" font-style="normal" letter-spacing="0">View project</text></svg>
