<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="937" viewBox="0 0 475 371" preserveAspectRatio="none" style="background-color:#0b1922" role="img" aria-labelledby="title desc"><title id="title">About me</title><desc id="desc">Noida, India. About me. I&#x27;m Dishank Jain, an AI engineer based in Noida, India. I build Python tools for semantic search, document extraction, and recommendations. I like being able to trace a result back to the input that produced it. With an FAQ assistant, that means checking which policy it retrieved. With a recommender, it means understanding why one product ranked above another. My projects bring machine learning models, Python APIs, and Flutter interfaces together.</desc><rect width="100%" height="100%" fill="#0b1922"/><path d="M20 0v371" stroke="#31515a"/><path d="M40 0.5L435 0.5" stroke="#29454c" fill="none"/><circle cx="20" cy="47" r="4" fill="#0b1922" stroke="#80ead2"/><circle cx="20" cy="47" r="1.2" fill="#80ead2"/><text x="40" y="58" fill="#e7f5f3" font-family="Arial,Helvetica,sans-serif" font-size="33" font-weight="700" font-style="normal" letter-spacing="-1.32">About</text><text x="135.941" y="58" fill="#80ead2" font-family="Georgia,'Liberation Serif',serif" font-size="33" font-weight="400" font-style="italic" letter-spacing="-1.32">me</text><text x="40" y="84" fill="#a1cbbe" font-family="'Liberation Mono',Consolas,monospace" font-size="11" font-weight="400" font-style="normal" letter-spacing="0.7">NOIDA, INDIA</text><text x="40" y="113" fill="#c1d8d9" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" font-style="normal" letter-spacing="0">I&#x27;m Dishank Jain, an AI engineer based in Noida,</text><text x="40" y="139" fill="#c1d8d9" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" font-style="normal" letter-spacing="0">India. I build Python tools for semantic search,</text><text x="40" y="165" fill="#c1d8d9" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" font-style="normal" letter-spacing="0">document extraction, and recommendations. I like</text><text x="40" y="191" fill="#c1d8d9" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" font-style="normal" letter-spacing="0">being able to trace a result back to the input that</text><text x="40" y="217" fill="#c1d8d9" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" font-style="normal" letter-spacing="0">produced it. With an FAQ assistant, that means</text><text x="40" y="243" fill="#c1d8d9" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" font-style="normal" letter-spacing="0">checking which policy it retrieved. With a</text><text x="40" y="269" fill="#c1d8d9" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" font-style="normal" letter-spacing="0">recommender, it means understanding why one</text><text x="40" y="295" fill="#c1d8d9" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" font-style="normal" letter-spacing="0">product ranked above another.</text><text x="40" y="321" fill="#c1d8d9" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" font-style="normal" letter-spacing="0">My projects bring machine learning models,</text><text x="40" y="347" fill="#c1d8d9" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" font-style="normal" letter-spacing="0">Python APIs, and Flutter interfaces together.</text></svg>
