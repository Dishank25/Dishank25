<svg xmlns="http://www.w3.org/2000/svg" width="960" height="297" viewBox="0 0 960 297" role="img" aria-labelledby="title desc"><title id="title">About me</title><desc id="desc">Noida, India. About me. I&#x27;m Dishank Jain, an AI engineer based in Noida, India. I build Python tools for semantic search, document extraction, and recommendations. I like being able to trace a result back to the input that produced it. With an FAQ assistant, that means checking which policy it retrieved. With a recommender, it means understanding why one product ranked above another. My projects bring machine learning models, Python APIs, and Flutter interfaces together.</desc><rect width="100%" height="100%" fill="#0b1922"/><path d="M32 0v297" stroke="#31515a"/><circle cx="32" cy="27" r="4.25" fill="#0b1922" stroke="#80ead2"/><circle cx="32" cy="27" r="1.3" fill="#80ead2"/><text x="64" y="31" fill="#80ead2" font-family="'Liberation Mono',Consolas,monospace" font-size="12" font-weight="400" font-style="normal" letter-spacing="0.9">NOIDA, INDIA</text><text x="64" y="79" fill="#e7f5f3" font-family="Arial,Helvetica,sans-serif" font-size="40" font-weight="700" font-style="normal" letter-spacing="-1.8">About</text><text x="178.531" y="79" fill="#80ead2" font-family="Georgia,'Liberation Serif',serif" font-size="40" font-weight="400" font-style="italic" letter-spacing="-1.8">me.</text><svg x="766" y="12" width="130" height="67" viewBox="0 0 200 105" preserveAspectRatio="xMidYMid meet" overflow="hidden" aria-hidden="true" stroke-linecap="round" stroke-linejoin="round"><path d="M4 101 C13 86 4 73 21 65 S48 59 52 44 S46 18 72 3" fill="none" stroke="#32515b" stroke-width="0.85" /><path d="M10 101 C19 86 10 73 27 65 S54 59 58 44 S52 18 78 3" fill="none" stroke="#32515b" stroke-width="0.85" /><path d="M16 101 C25 86 16 73 33 65 S60 59 64 44 S58 18 84 3" fill="none" stroke="#32515b" stroke-width="0.85" /><path d="M22 101 C31 86 22 73 39 65 S66 59 70 44 S64 18 90 3" fill="none" stroke="#32515b" stroke-