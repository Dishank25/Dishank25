t x="40" y="272" fill="#c1d8d9" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" font-style="normal" letter-spacing="0">wrong policy still counts as a</text><text x="40" y="295" fill="#c1d8d9" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" font-style="normal" letter-spacing="0">miss.</text><text x="40" y="324" fill="#80ead2" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" font-style="normal" letter-spacing="0">View project</text><path d="M295 10 L295 336" stroke="#29454c" fill="none"/></svg>
